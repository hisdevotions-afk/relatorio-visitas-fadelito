name: Agente Reagendamento

on:
  # Cron desligado em 2026-07-03: fluxo proativo migrado para n8n
  # (workflow "Fadelito · Agente Reagendamento (Proativo)", id NKbcQq9hQu4kHLfh).
  # Rodar os dois em paralelo duplicaria as mensagens enviadas aos leads.
  # workflow_dispatch continua disponível para rodar manualmente se precisar.
  workflow_dispatch:
    inputs:
      tab:
        description: 'Aba da planilha (dd/mm/yyyy). Deixe em branco para último dia útil.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (não envia WhatsApp nem grava no Sheets)'
        type: boolean
        default: false

jobs:
  processar-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Processar leads
        env:
          API_BASE_URL: https://${{ secrets.GENDO_SUBDOMINIO }}.adm.gendo.app/api
          API_TOKEN: ${{ secrets.GENDO_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_SOURCE_NUMBER: ${{ secrets.WHATSAPP_SOURCE_NUMBER }}
          WHATSAPP_APP_NAME: ${{ secrets.WHATSAPP_APP_NAME }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_ID: ${{ secrets.WHATSAPP_TEMPLATE_ID }}
          WHATSAPP_SDR_NUMBER: ${{ secrets.WHATSAPP_SDR_NUMBER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODO_TESTE: ${{ secrets.MODO_TESTE }}
          WHATSAPP_TESTE_NUMBER: ${{ secrets.WHATSAPP_TESTE_NUMBER }}
          DATA_OVERRIDE: ${{ inputs.tab }}
        run: |
          cd agente_reagendamento
          ARGS="--processar"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS
